# 千寻云仓通生产部署拓扑
#
# 目标：
# - 数据库数据保存在 Docker 命名卷 yuncang_mysql_data 中。
# - 应用升级只重建 backend/frontend，不把数据库打进应用镜像。
# - 数据库端口默认只绑定 127.0.0.1，避免公网暴露。

services:
  db:
    image: mariadb:10.5
    container_name: ${DB_CONTAINER_NAME:-yuncang-db}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-yuncang}
      MARIADB_USER: ${MARIADB_USER:-yuncang}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-13306}:3306"
    volumes:
      - yuncang_mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-yuncang-backend:local}
    container_name: ${BACKEND_CONTAINER_NAME:-yuncang-backend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8001
      DB_HOST: db
      DB_USER: ${MARIADB_USER:-yuncang}
      DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      DB_DATABASE: ${MARIADB_DATABASE:-yuncang}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${FRONTEND_IMAGE:-yuncang-frontend:local}
    container_name: ${FRONTEND_CONTAINER_NAME:-yuncang-frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  yuncang_mysql_data:
    name: ${DB_VOLUME_NAME:-yuncang_mysql_data}
